apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: hello-k2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-k2
  template:
    metadata:
      labels:
        app: hello-k2
    spec:
      containers:
      - name: hello-k2
        image: paulbouwer/hello-kubernetes:1.10
        env: 
        - name: MESSAGE
          value: "Hello from app2"
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: app2-svc
spec:
  selector:
    app: hello-k2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080