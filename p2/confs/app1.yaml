apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    app: hello-k1 
spec:
  selector:
    matchLabels:
      app: hello-k1
  template:
    metadata:
      labels:
        app: hello-k1 
    spec:
      containers:
      - name: hello-k1
        image: paulbouwer/hello-kubernetes:1.10
        env: 
        - name: MESSAGE
          value: "Hello from app1"
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: app1-svc
spec:
  selector:
    app: hello-k1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080