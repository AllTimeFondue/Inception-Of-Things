apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  labels:
    app: hello-k3 
spec:
  selector:
    matchLabels:
      app: hello-k3 
  template:
    metadata:
      labels:
        app: hello-k3
    spec:
      containers:
      - name: hello-k3
        image: paulbouwer/hello-kubernetes:1.10
        env: 
        - name: MESSAGE
          value: "Hello from app3"
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: app3-svc
spec:
  selector:
    app: hello-k3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080